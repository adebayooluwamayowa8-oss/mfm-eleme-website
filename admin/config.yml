backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "_data/settings.json"
        fields:
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address Line 1", name: "address_line1", widget: "string" }
          - { label: "Address Line 2", name: "address_line2", widget: "string" }
          - { label: "City / State", name: "address_city", widget: "string" }
          - { label: "Postal Code", name: "postal_code", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string" }
          - { label: "YouTube URL", name: "youtube", widget: "string" }
          - { label: "TikTok URL", name: "tiktok", widget: "string" }
          - label: "Online Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
          - label: "Online Broadcasts"
            name: "broadcasts"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/home.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Hero Slides"
            name: "slides"
            widget: "list"
            fields:
              - { label: "Heading", name: "heading", widget: "text" }
              - { label: "Verse", name: "verse", widget: "text" }
              - { label: "Verse Source", name: "source", widget: "string" }
              - { label: "Background Image", name: "image", widget: "image" }
          - label: "Gallery Images"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image" }

      - label: "Who We Are"
        name: "who-we-are"
        file: "content/who-we-are.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "What We Do"
        name: "what-we-do"
        file: "content/what-we-do.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Resources"
        name: "resources"
        file: "content/resources.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "Links & Documents"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string", hint: "Paste any link here \u2014 a webpage, a PDF, a document, anything." }

      - label: "Giving & Offering"
        name: "giving"
        file: "content/giving.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro Text", name: "body", widget: "markdown" }
          - label: "Bank Accounts"
            name: "accounts"
            widget: "list"
            fields:
              - { label: "Bank Name", name: "bank_name", widget: "string" }
              - { label: "Account Name", name: "account_name", widget: "string" }
              - { label: "Account Number", name: "account_number", widget: "string" }
              - { label: "Currency (optional)", name: "currency", widget: "string", required: false }
          - { label: "Note (optional)", name: "note", widget: "text", required: false }

      - label: "Contact Us"
        name: "contact"
        file: "content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "sermons"
    label: "Sermons & Audio Messages"
    folder: "content/sermons"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Speaker", name: "speaker", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Audio / Video Link", name: "audio_url", widget: "string", hint: "Paste a link to your audio file, YouTube video, or SoundCloud track." }
      - { label: "Description", name: "body", widget: "markdown", required: false }
